name: p520 Schema CI

on:
  push:
    branches:
      - feature/wolf-modern-xdat
  pull_request:
    paths:
      - 'xdat_editor/schema/**'
      - 'xdat_editor/build.xml'
      - '.github/workflows/p520-schema-ci.yml'

jobs:
  build-p520-schema:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 with JavaFX
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          java-package: 'jdk+fx'

      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      - name: Compile XDAT Editor and p520 schema
        run: ant -f xdat_editor/build.xml clean dist
